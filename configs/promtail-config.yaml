server:
  http_listen_port: 9080
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: default

scrape_configs:
  - job_name: syslog
    syslog:
      protocol_config:
        protocol: rfc5424
        location: 0.0.0.0:514
    relabel_configs:
      - source_labels: [__syslog_message_hostname]
        target_label: host
      - source_labels: [__syslog_message_app_name]
        target_label: application

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
      - source_labels: [__meta_docker_container_image_name]
        target_label: image_name
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

  - job_name: systemd
    systemd_sd_configs:
      - units:
          - moni.service
          - docker.service
          - kubelet.service
    relabel_configs:
      - source_labels: ['__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__systemd_slice']
        target_label: 'slice'

  - job_name: local-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: local-files
          env: development
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          message:

  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          env: development
    pipeline_stages:
      - multiline:
          line_start_pattern: '^\w+\s+\w+\s+\d+'
      - regex:
          expression: '^(?P<timestamp>.*) (?P<host>.*) (?P<ident>.*?)\[?(?P<pid>\d*)?\]?: (?P<message>.*)$'
      - timestamp:
          source: timestamp
          format: 'Jan 2 15:04:05'
      - labels:
          host:
          ident:
