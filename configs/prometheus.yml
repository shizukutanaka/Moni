global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'moni-cluster'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'moni'
    static_configs:
      - targets: ['moni:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'opencost'
    static_configs:
      - targets: ['opencost:9003']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  - job_name: 'mimir'
    static_configs:
      - targets: ['mimir:9009']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
