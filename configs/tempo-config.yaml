server:
  http_listen_port: 3200
  grpc_listen_port: 4317

distributor:
  rate_limit_bytes: 10485760  # 10MB
  rate_limit_spans: 1000000

ingester:
  trace_idle_period: 10s
  trace_timeout: 10s
  max_block_bytes: 1073741824  # 1GB
  max_block_duration: 5m

memberlist:
  node_name: tempo
  bind_port: 7946
  dead_node_reclaim_time: 30s
  retransmit_factor: 4

metrics_generator:
  processors:
    - service-graphs
    - span-metrics
  storage:
    path: /var/tempo/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write

storage:
  trace:
    backend: s3
    s3:
      endpoint: minio:9000
      bucket: tempo
      access_key: minioadmin
      secret_key: minioadmin
      insecure: true
    wal:
      path: /var/tempo/wal
      checkpoint_duration: 5m
      block_retention: 10m

querier:
  max_concurrent_traces: 10

query_frontend:
  trace_by_id:
    query_shards: 1
    hedge_requests_at: 2
    hedge_requests_up_to: 5

logging:
  level: info
  format: json
