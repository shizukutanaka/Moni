# Moni Billing Tier Configuration
# Version: 2.0
# Last Updated: 2025-10-08

currency: usd
tax_enabled: false

tiers:
  essential:
    name: Essential
    display_name: "Essential Monitoring"
    stripe_price_id: price_essential_monthly
    description: "Core monitoring for single endpoints with basic security"
    billing_interval: month
    trial_period_days: 0
    base_price: 29.00
    features:
      endpoints:
        limit: 1
        metered: false
        description: "Single endpoint monitoring"
      retention_days:
        limit: 7
        metered: false
        description: "7-day metrics retention"
      alerts_per_month:
        limit: 100
        metered: false
        overage_price: 0.10
        description: "100 alerts per month"
      dashboards:
        enabled: true
        description: "Basic monitoring dashboards"
      rbac:
        enabled: false
        description: "Role-based access control"
      compliance_exports:
        enabled: false
        description: "ISO 27001/NIST compliance reports"
      intrusion_detection:
        enabled: false
        description: "Advanced intrusion detection"
      api_calls:
        limit: 1000
        metered: false
        description: "API requests per month"
      support:
        level: "community"
        description: "Community support via forums"

  professional:
    name: Professional
    display_name: "Professional Security"
    stripe_price_id: price_professional_monthly
    description: "Advanced monitoring with RBAC and compliance features"
    billing_interval: month
    trial_period_days: 7
    base_price: 99.00
    features:
      endpoints:
        limit: 10
        metered: false
        overage_price: 5.00
        description: "Up to 10 endpoints"
      retention_days:
        limit: 30
        metered: false
        description: "30-day metrics retention"
      alerts_per_month:
        limit: 1000
        metered: false
        overage_price: 0.05
        description: "1,000 alerts per month"
      dashboards:
        enabled: true
        description: "Advanced dashboards with custom views"
      rbac:
        enabled: true
        description: "Full RBAC with team management"
      compliance_exports:
        enabled: true
        description: "Compliance reports (ISO 27001, NIST CSF)"
      intrusion_detection:
        enabled: false
        description: "Basic security monitoring"
      api_calls:
        limit: 10000
        metered: false
        description: "10,000 API requests per month"
      support:
        level: "email"
        sla_hours: 24
        description: "Email support with 24h SLA"

  enterprise:
    name: Enterprise
    display_name: "Enterprise Security Suite"
    stripe_price_id: price_enterprise_monthly
    description: "Full security suite with unlimited scale and priority support"
    billing_interval: month
    trial_period_days: 14
    base_price: 299.00
    features:
      endpoints:
        limit: null  # unlimited base, metered beyond 10
        metered: true
        metered_price_id: price_enterprise_endpoint
        unit_price: 10.00
        included_quantity: 10
        description: "Unlimited endpoints ($10 per endpoint beyond 10)"
      retention_days:
        limit: 90
        metered: true
        metered_price_id: price_enterprise_retention
        unit_price: 50.00
        unit_size: 90
        description: "90-day retention (extensible at $50/90 days)"
      alerts_per_month:
        limit: null
        metered: false
        description: "Unlimited alerts"
      dashboards:
        enabled: true
        description: "Custom dashboards with advanced analytics"
      rbac:
        enabled: true
        description: "Enterprise RBAC with audit logging"
      compliance_exports:
        enabled: true
        description: "Full compliance suite (ISO 27001, NIST CSF, GDPR, FIPS 140-2)"
      intrusion_detection:
        enabled: true
        description: "Advanced IDS with real-time threat detection"
      encryption_at_rest:
        enabled: true
        description: "AES-256-GCM encryption for all data"
      totp_2fa:
        enabled: true
        description: "TOTP two-factor authentication"
      api_calls:
        limit: null
        metered: true
        metered_price_id: price_enterprise_api
        unit_price: 1.00
        included_quantity: 100000
        unit_size: 10000
        description: "100K API calls included ($1 per 10K beyond)"
      support:
        level: "priority"
        sla_hours: 4
        description: "Priority support with 4h SLA and dedicated account manager"
      custom_integrations:
        enabled: true
        description: "Custom integration development"

# Usage-based add-ons (available to all tiers)
addons:
  additional_endpoints:
    stripe_price_id: price_addon_endpoint
    name: "Additional Endpoints"
    description: "Add more monitored endpoints"
    unit_price: 10.00
    billing_interval: month
    available_for: ["essential", "professional"]

  extended_retention:
    stripe_price_id: price_addon_retention
    name: "Extended Retention"
    description: "Extend metrics retention beyond tier limit"
    unit_price: 50.00
    unit_size: 90  # days
    billing_interval: month
    available_for: ["essential", "professional"]

  security_scans:
    stripe_price_id: price_addon_security_scan
    name: "Security Vulnerability Scans"
    description: "On-demand security vulnerability scanning"
    unit_price: 0.10
    billing_interval: month
    metered: true
    available_for: ["professional", "enterprise"]

  api_overage:
    stripe_price_id: price_addon_api_calls
    name: "API Call Overage"
    description: "Additional API calls beyond tier limit"
    unit_price: 1.00
    unit_size: 10000
    billing_interval: month
    metered: true
    available_for: ["professional"]

# Feature gates and quota enforcement
quota_enforcement:
  enabled: true
  soft_limit_threshold: 0.9  # Warn at 90% usage
  hard_limit_behavior: "block"  # or "allow_overage"

# Grace period for payment failures
payment_recovery:
  grace_period_days: 7
  retry_schedule: [3, 7, 14]  # Days after failure
  suspension_delay_days: 8

# Proration settings
proration:
  enabled: true
  upgrade_behavior: "immediate"  # Apply immediately with proration
  downgrade_behavior: "end_of_period"  # Apply at period end

# Tax configuration
tax:
  enabled: false  # Set to true to enable Stripe Tax
  tax_code: "txcd_10000000"  # Software as a Service
  prices_include_tax: false
  collect_tax_id: true

# Stripe configuration
stripe:
  success_url: "${MONI_STRIPE_SUCCESS_URL}"
  cancel_url: "${MONI_STRIPE_CANCEL_URL}"
  webhook_tolerance_seconds: 300
  portal_enabled: true
