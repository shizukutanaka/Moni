<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moni — PC Device Info Viewer</title>
<style>
:root{
  --bg:#0d1117; --bg2:#111826; --card:#161e2c; --card2:#1b2637;
  --line:#2a3648; --text:#e6edf3; --sub:#93a4bb; --faint:#6b7c93;
  --accent:#4da3ff; --accent2:#2f7fe0;
  --ok:#3fb96f; --warn:#e8a33d; --bad:#e5534b; --gray:#8b98a9;
  --chip:#22314a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:14px}
header.top{
  position:sticky; top:0; z-index:40;
  background:rgba(13,17,23,.94); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.logo{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.logo .name{font-size:24px; font-weight:800; letter-spacing:3px}
.logo .name span{color:var(--accent)}
.logo .tag{color:var(--sub); font-size:12px}
.top-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{
  background:var(--card2); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:8px 14px; font-size:13.5px; font-weight:600;
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent2); border-color:var(--accent2); color:#fff}
.btn.primary:hover{background:var(--accent)}
.btn:disabled{opacity:.45; cursor:not-allowed}
select.langsel{
  background:var(--card2); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:8px 10px; font-size:13.5px; font-weight:600;
}
main{max-width:1080px; margin:0 auto; padding:18px 16px 60px}
.notice{
  background:#221a10; border:1px solid #6b4d1f; color:#f0cf9a;
  border-radius:10px; padding:10px 14px; font-size:13.5px; margin-bottom:16px;
}
.notice.sample{background:#101d2e; border-color:#2f5b8f; color:#a9ccf5}
.notice.err{background:#2e1414; border-color:#8f2f2f; color:#f5a9a9}
.searchbar{display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap}
.searchbar input{
  flex:1; min-width:220px; background:var(--card); color:var(--text);
  border:1px solid var(--line); border-radius:8px; padding:9px 12px;
}
.meta{color:var(--sub); font-size:13px; margin-bottom:14px}
.meta b{color:var(--text)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px}
.card h3{margin:0 0 10px; font-size:16px; display:flex; align-items:center; gap:8px}
.card h3 .ic{font-size:18px}
.card .subttl{color:var(--sub); font-size:12.5px; font-weight:700; margin:12px 0 4px; text-transform:uppercase; letter-spacing:.5px}
table.kv{width:100%; border-collapse:collapse}
table.kv tr td{padding:4px 0; vertical-align:top}
table.kv td.k{color:var(--sub); width:42%; padding-right:10px; font-size:13.5px}
table.kv td.v{font-weight:600; word-break:break-word}
td.v.na{color:var(--faint); font-weight:400; font-style:italic}
.bar{height:8px; background:var(--card2); border-radius:4px; overflow:hidden; margin-top:4px}
.bar > div{height:100%; background:var(--accent2)}
.bar > div.hot{background:var(--bad)}
.empty{
  background:var(--card); border:1px dashed var(--line); border-radius:12px;
  padding:34px 26px; text-align:center; color:var(--sub);
}
.empty h2{color:var(--text); margin:0 0 8px}
.empty ol{text-align:left; max-width:520px; margin:14px auto 0; line-height:1.9}
#dropOverlay{
  position:fixed; inset:0; z-index:90; display:none;
  background:rgba(13,17,23,.88); border:3px dashed var(--accent);
  align-items:center; justify-content:center; font-size:22px; font-weight:700;
}
.modal{
  position:fixed; inset:0; z-index:80; display:none;
  background:rgba(0,0,0,.6); align-items:center; justify-content:center; padding:16px;
}
.modal .box{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:20px; width:640px; max-width:100%}
.modal textarea{
  width:100%; height:260px; background:var(--card); color:var(--text);
  border:1px solid var(--line); border-radius:8px; padding:10px; font-family:monospace; font-size:12.5px;
}
.modal .row{display:flex; gap:8px; justify-content:flex-end; margin-top:12px}
.modal .opt{display:block; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:10px; cursor:pointer}
.modal .opt input{margin-right:8px}
.modal .optinfo{color:var(--sub); font-size:13px; margin-top:6px; line-height:1.6}
.modal .optinfo.warn{color:#f0cf9a}
#diffArea{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:16px 18px; margin-bottom:16px;
}
#diffArea h3{margin:0 0 6px; font-size:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
#diffArea h3 .spacer{margin-left:auto}
#diffArea .dmeta{color:var(--sub); font-size:13px; margin-bottom:8px}
#diffArea .dsummary{font-weight:700; margin-bottom:10px}
#diffArea .dcat{color:var(--sub); font-size:12.5px; font-weight:700; margin:12px 0 4px; text-transform:uppercase; letter-spacing:.5px}
.diffrow{display:flex; gap:8px; align-items:baseline; padding:3px 0; flex-wrap:wrap}
.diffrow .dlabel{font-weight:600; min-width:180px}
.diffrow .dbefore{color:#f5a9a9; text-decoration:line-through}
.diffrow .dafter{color:#a9e5bc; font-weight:600}
.diffrow .darrow{color:var(--faint)}
.chip{display:inline-block; border-radius:6px; padding:0 7px; font-size:12px; font-weight:700; background:var(--chip); color:var(--sub)}
.chip.add{background:#12351f; color:#7fd79b}
.chip.del{background:#3d1717; color:#f0938d}
.chip.chg{background:#3a2c10; color:#f0cf9a}
#diffArea details{margin-top:12px}
#diffArea summary{cursor:pointer; color:var(--sub); font-size:13.5px}
#diffArea .unchanged-list{color:var(--sub); font-size:13.5px; margin-top:6px; line-height:1.7}
#diffArea .dnote{color:var(--faint); font-size:12.5px; margin-top:12px}
footer{max-width:1080px; margin:0 auto; padding:0 16px 30px; color:var(--faint); font-size:12.5px}
@media (max-width:640px){ .cards{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo">
      <div class="name">MO<span>NI</span></div>
      <div class="tag" data-i18n="tagline"></div>
    </div>
    <div class="top-actions">
      <button class="btn primary" id="btnOpen" data-i18n="btnOpen"></button>
      <button class="btn" id="btnPaste" data-i18n="btnPaste"></button>
      <button class="btn" id="btnSample" data-i18n="btnSample"></button>
      <button class="btn" id="btnExportTxt" data-i18n="btnExportTxt" disabled></button>
      <button class="btn" id="btnExportJson" data-i18n="btnExportJson" disabled></button>
      <button class="btn" id="btnShareExport" data-i18n="btnShare" disabled></button>
      <select class="langsel" id="langSel" aria-label="Language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>
</header>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">
<input type="file" id="compareFileInput" accept=".json,application/json" style="display:none">
<div id="dropOverlay"><span data-i18n="dropHere"></span></div>

<main>
  <div class="notice" data-i18n="honestNotice"></div>
  <div class="notice sample" id="sampleBanner" style="display:none" data-i18n="sampleBanner"></div>
  <div class="notice err" id="errBanner" style="display:none"></div>

  <div class="empty" id="emptyState">
    <h2 data-i18n="emptyTitle"></h2>
    <div data-i18n="emptyBody"></div>
    <ol>
      <li data-i18n="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n="step3"></li>
    </ol>
  </div>

  <div id="reportArea" style="display:none">
    <div class="meta" id="reportMeta"></div>
    <div id="diffArea" style="display:none"></div>
    <div class="searchbar">
      <input type="text" id="searchInput">
      <button class="btn" id="btnCompare" data-i18n="btnCompare"></button>
    </div>
    <div class="cards" id="cards"></div>
    <div class="empty" id="noMatch" style="display:none" data-i18n="noMatch"></div>
  </div>
</main>

<footer data-i18n="footerNote"></footer>

<div class="modal" id="shareModal">
  <div class="box">
    <h3 style="margin-top:0" data-i18n="shareTitle"></h3>
    <div data-i18n="shareIntro"></div>
    <label class="opt">
      <input type="radio" name="shareMask" value="masked" checked>
      <span data-i18n="shareMaskOn"></span>
      <div class="optinfo" id="shareMaskedInfo">
        <div data-i18n="shareMaskedList"></div>
        <div data-i18n="shareMaskNote"></div>
      </div>
    </label>
    <label class="opt">
      <input type="radio" name="shareMask" value="full">
      <span data-i18n="shareMaskOff"></span>
      <div class="optinfo warn" id="shareFullInfo" style="display:none" data-i18n="shareUnmaskedList"></div>
    </label>
    <div class="row">
      <button class="btn" id="btnShareCancel" data-i18n="btnCancel"></button>
      <button class="btn" id="btnShareTxt" data-i18n="btnExportTxt"></button>
      <button class="btn primary" id="btnShareJson" data-i18n="btnExportJson"></button>
    </div>
  </div>
</div>

<div class="modal" id="pasteModal">
  <div class="box">
    <h3 style="margin-top:0" data-i18n="pasteTitle"></h3>
    <textarea id="pasteText" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn" id="btnPasteCancel" data-i18n="btnCancel"></button>
      <button class="btn primary" id="btnPasteLoad" data-i18n="btnLoad"></button>
    </div>
  </div>
</div>

const state = { lang: "ja", report: null, compare: null };
const $ = (id) => document.getElementById(id);
const t = (key) => (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key;
const isNil = (v) => v === null || v === undefined || v === "" || (Array.isArray(v) && v.length === 0);

/* ---------- formatting ---------- */
function fmtBytes(n) {
  if (isNil(n) || typeof n !== "number") return null;
  const units = ["B", "KB", "MB", "GB", "TB", "PB"];
  let v = n, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v >= 100 ? 0 : 1)) + " " + units[i];
}
function fmtMHz(mhz) {
  if (isNil(mhz) || typeof mhz !== "number") return null;
  return mhz >= 1000 ? (mhz / 1000).toFixed(2).replace(/\.?0+$/, "") + " GHz" : mhz + " MHz";
}
function fmtUptime(sec) {
  if (isNil(sec) || typeof sec !== "number") return null;
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  const parts = [];
  if (d) parts.push(d + " " + t("days"));
  if (h || d) parts.push(h + " " + t("hours"));
  parts.push(m + " " + t("minutes"));
  return parts.join(" ");
}
/* SMART health is stored as a normalized code ("ok" / "warning" /
   "critical") so the viewer can localize it; anything else (including
   a report collected before SMART existed) shows as Unavailable. */
function fmtSmartStatus(s) {
  if (s === "ok") return t("smartOk");
  if (s === "warning") return t("smartWarning");
  if (s === "critical") return t("smartCritical");
  return null;
}

/* ---------- row / card builders ----------
   Each row carries searchable text so the filter can match label + value. */
function row(label, value) {
  const display = isNil(value) ? t("na") : String(value);
  return { label, display, na: isNil(value), search: (label + " " + display).toLowerCase() };
}
function rowHtml(r) {
  return `<tr data-search="${escapeHtml(r.search)}"><td class="k">${escapeHtml(r.label)}</td><td class="v${r.na ? " na" : ""}">${escapeHtml(r.display)}</td></tr>`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function kvTable(rows) {
  return `<table class="kv">${rows.map(rowHtml).join("")}</table>`;
}
function card(icon, title, innerHtml) {
  return `<section class="card"><h3><span class="ic">${icon}</span>${escapeHtml(title)}</h3>${innerHtml}</section>`;
}

/* ---------- report -> sections (shared shape for HTML and text export) ---------- */
function buildSections(rep) {
  const S = [];
  const sys = rep.system || {};
  S.push({ icon: "🖥️", title: t("catSystem"), groups: [{ rows: [
    row(t("fComputerName"), sys.computerName),
    row(t("fManufacturer"), sys.manufacturer),
    row(t("fModel"), sys.model),
    row(t("fOs"), sys.osName),
    row(t("fOsVersion"), sys.osVersion),
    row(t("fOsBuild"), sys.osBuild),
    row(t("fUptime"), fmtUptime(sys.uptimeSeconds))

  const cpu = rep.cpu || {};
  S.push({ icon: "🧠", title: t("catCpu"), groups: [{ rows: [

  const mem = rep.memory || {};

  const gpuGroups = (rep.gpus && rep.gpus.length ? rep.gpus : [{}]).map((g, i) => ({

      row(t("fCpuName"), g.name),

  const mb = rep.motherboard || {};

    row(t("fManufacturer"), mb.manufacturer),

  const st = rep.storage || {};

  stGroups.push({ subtitle: t("fPhysicalDisks"), rows: (st.physical && st.physical.length ? st.physical : [{}]).flatMap((d) => {
    const sm = d.smart || {};
    return [
      row(t("fModel"), d.model),
      row(t("fSize"), fmtBytes(d.sizeBytes)),
      row(t("fMediaType"), d.mediaType),
      row(t("fBusType"), d.busType),
      row(t("fSmartStatus"), fmtSmartStatus(sm.status)),

      row(t("fSmartHours"), isNil(sm.powerOnHours) ? null : sm.powerOnHours + " " + t("hours")),
      row(t("fSmartCount"), sm.powerOnCount)
    ];
  }) });
  const logicalRows = [];
  (st.logical || []).forEach((d) => {
    const usedPct = (!isNil(d.totalBytes) && !isNil(d.freeBytes) && d.totalBytes > 0)
      ? Math.round((1 - d.freeBytes / d.totalBytes) * 100) : null;
    logicalRows.push({ ...row(t("fDrive"), d.drive + (d.label ? " (" + d.label + ")" : "")), bar: usedPct });
    logicalRows.push(row(t("fFileSystem"), d.fileSystem));
    logicalRows.push(row(t("fSize"), fmtBytes(d.totalBytes)));
    logicalRows.push(row(t("fFree"), fmtBytes(d.freeBytes)));
  });
  if (!logicalRows.length) logicalRows.push(row(t("fLogicalDrives"), null));
  stGroups.push({ subtitle: t("fLogicalDrives"), rows: logicalRows });

  const netGroups = (rep.network && rep.network.length ? rep.network : [{}]).map((n) => ({
    subtitle: n.name || null,
    rows: [

  }));
  S.push({ icon: "🖵", title: t("catDisplay"), groups: dispGroups });

  let battGroups;

    : [row(t("catPeripherals"), null)];
  S.push({ icon: "🔗", title: t("catPeripherals"), groups: [{ rows: periRows }] });

  return S;
}

/* ---------- diff: flatten a report into comparable items ----------
   Items are keyed by stable identity (device names, drive letters, part
   numbers) rather than array position, so adding or removing a device
   does not shift everything else. Values are the same display strings
   the viewer shows, or null for "unavailable".
   Deliberately NOT compared (they change without any device change):
   collectedAt, uptime, free disk space, battery charge/status, the
   network connection status and the SMART temperature / power-on
   hours / power-on count. The SMART health status IS compared: a disk
   going from healthy to failing is a device change. This list is
   also shown in the UI. */
function flattenReport(rep) {
  const items = [];
  const push = (key, catKey, label, value) => {
    items.push({ key, catKey, label, value: isNil(value) ? null : String(value) });
  };
  const occ = {};
  const keyed = (base) => {
    const n = occ[base] || 0;
    occ[base] = n + 1;
    return base + "#" + n;
  };
  const grp = (name, idLabel) => name + " (" + (idLabel || t("na")) + ")";

  const sys = rep.system || {};
  push("system.computerName", "catSystem", t("fComputerName"), sys.computerName);
  push("system.manufacturer", "catSystem", t("fManufacturer"), sys.manufacturer);
  push("system.model", "catSystem", t("fModel"), sys.model);
  push("system.osName", "catSystem", t("fOs"), sys.osName);
  push("system.osVersion", "catSystem", t("fOsVersion"), sys.osVersion);
  push("system.osBuild", "catSystem", t("fOsBuild"), sys.osBuild);

  const cpu = rep.cpu || {};
  push("cpu.name", "catCpu", t("fCpuName"), cpu.name);
  push("cpu.cores", "catCpu", t("fCores"), cpu.cores);
  push("cpu.logicalProcessors", "catCpu", t("fThreads"), cpu.logicalProcessors);
  push("cpu.maxClockMHz", "catCpu", t("fMaxClock"), fmtMHz(cpu.maxClockMHz));

  const mem = rep.memory || {};
  push("memory.totalBytes", "catMemory", t("fMemTotal"), fmtBytes(mem.totalBytes));
  (mem.modules || []).forEach((m) => {
    const id = keyed("memory.module|" + [m.partNumber || "", m.capacityBytes || "", m.type || "", m.manufacturer || ""].join("|"));
    const g = grp(t("fMemModule"), m.partNumber);
    push(id, "catMemory", g, t("diffPresent"));
    push(id + ".capacityBytes", "catMemory", g + " / " + t("fCapacity"), fmtBytes(m.capacityBytes));
    push(id + ".type", "catMemory", g + " / " + t("fMemType"), m.type);
    push(id + ".speedMHz", "catMemory", g + " / " + t("fSpeed"), isNil(m.speedMHz) ? null : m.speedMHz + " MHz");
    push(id + ".manufacturer", "catMemory", g + " / " + t("fManufacturer"), m.manufacturer);
    push(id + ".partNumber", "catMemory", g + " / " + t("fPartNumber"), m.partNumber);
  });

  (rep.gpus || []).forEach((g0) => {
    const id = keyed("gpu|" + (g0.name || ""));
    const g = grp("GPU", g0.name);
    push(id, "catGpu", g, t("diffPresent"));
    push(id + ".vramBytes", "catGpu", g + " / " + t("fVram"), fmtBytes(g0.vramBytes));
    push(id + ".driverVersion", "catGpu", g + " / " + t("fDriver"), g0.driverVersion);
  });

  const mb = rep.motherboard || {};
  push("motherboard.manufacturer", "catMotherboard", t("fManufacturer"), mb.manufacturer);
  push("motherboard.product", "catMotherboard", t("fBoardProduct"), mb.product);
  push("motherboard.biosVersion", "catMotherboard", t("fBiosVersion"), mb.biosVersion);
  push("motherboard.biosDate", "catMotherboard", t("fBiosDate"), mb.biosDate);

  const st = rep.storage || {};
  (st.physical || []).forEach((d) => {
    const id = keyed("storage.physical|" + (d.model || ""));
    const g = grp(t("fPhysicalDisks"), d.model);
    push(id, "catStorage", g, t("diffPresent"));
    push(id + ".sizeBytes", "catStorage", g + " / " + t("fSize"), fmtBytes(d.sizeBytes));
    push(id + ".mediaType", "catStorage", g + " / " + t("fMediaType"), d.mediaType);
    push(id + ".busType", "catStorage", g + " / " + t("fBusType"), d.busType);
    push(id + ".smartStatus", "catStorage", g + " / " + t("fSmartStatus"), fmtSmartStatus((d.smart || {}).status));
  });
  (st.logical || []).forEach((d) => {
    const id = keyed("storage.logical|" + (d.drive || ""));
    const g = grp(t("fDrive"), d.drive);
    push(id, "catStorage", g, t("diffPresent"));
    push(id + ".label", "catStorage", g + " / " + t("fLabel"), d.label);
    push(id + ".fileSystem", "catStorage", g + " / " + t("fFileSystem"), d.fileSystem);
    push(id + ".totalBytes", "catStorage", g + " / " + t("fSize"), fmtBytes(d.totalBytes));
  });

  (rep.network || []).forEach((n) => {
    const id = keyed("network|" + (n.name || ""));
    const g = grp(t("catNetwork"), n.name);
    push(id, "catNetwork", g, t("diffPresent"));
    push(id + ".description", "catNetwork", g + " / " + t("fDesc"), n.description);
    push(id + ".ipv4", "catNetwork", g + " / " + t("fIpv4"), (n.ipv4 || []).join(", ") || null);
    push(id + ".ipv6", "catNetwork", g + " / " + t("fIpv6"), (n.ipv6 || []).join(", ") || null);
    push(id + ".macAddress", "catNetwork", g + " / " + t("fMac"), n.macAddress);
    push(id + ".linkSpeedMbps", "catNetwork", g + " / " + t("fLinkSpeed"), isNil(n.linkSpeedMbps) ? null : n.linkSpeedMbps + " Mbps");
  });

  (rep.displays || []).forEach((d) => {
    const id = keyed("display|" + (d.name || ""));
    const g = grp(t("catDisplay"), d.name);
    push(id, "catDisplay", g, t("diffPresent"));
    push(id + ".resolution", "catDisplay", g + " / " + t("fResolution"), (isNil(d.width) || isNil(d.height)) ? null : d.width + " × " + d.height);
    push(id + ".refreshRateHz", "catDisplay", g + " / " + t("fRefresh"), isNil(d.refreshRateHz) ? null : d.refreshRateHz + " Hz");
  });

  if (rep.battery === null || rep.battery === undefined) {
    push("battery.presence", "catBattery", t("catBattery"), t("noBattery"));
  } else {
    const b = rep.battery;
    push("battery.presence", "catBattery", t("catBattery"), t("diffPresent"));
    push("battery.designCapacityMWh", "catBattery", t("fDesignCap"), isNil(b.designCapacityMWh) ? null : b.designCapacityMWh + " mWh");
    push("battery.fullChargeCapacityMWh", "catBattery", t("fFullCap"), isNil(b.fullChargeCapacityMWh) ? null : b.fullChargeCapacityMWh + " mWh");
  }

  (rep.peripherals || []).forEach((p) => {
    const id = keyed("peripheral|" + (p.name || ""));
    push(id, "catPeripherals", p.name || "", p.description);
  });

  return items;
}

function diffReports(before, after) {
  const fb = flattenReport(before);
  const fa = flattenReport(after);
  const mapA = new Map(fa.map((e) => [e.key, e]));
  const seenA = new Set();
  const changes = [];
  const unchanged = [];
  fb.forEach((eb) => {
    const ea = mapA.get(eb.key);
    if (!ea) {
      changes.push({ type: "removed", key: eb.key, catKey: eb.catKey, label: eb.label, before: eb.value, after: null });
      return;
    }
    seenA.add(eb.key);
    if (eb.value === ea.value) unchanged.push({ key: eb.key, catKey: eb.catKey, label: eb.label, value: eb.value });
    else changes.push({ type: "changed", key: eb.key, catKey: eb.catKey, label: eb.label, before: eb.value, after: ea.value });
  });
  fa.forEach((ea) => {
    if (!seenA.has(ea.key)) {
      changes.push({ type: "added", key: ea.key, catKey: ea.catKey, label: ea.label, before: null, after: ea.value });
    }
  });
  /* A device that was added or removed as a whole collapses into its
     single presence entry; listing every field of it would be noise. */
  const isPresence = (k) => /\|\S+#\d+$/.test(k);
  const deviceOf = (k) => {
    const m = k.match(/^(.+?#\d+)\./);
    return m ? m[1] : null;
  };
  const collapsed = changes.filter((c) => {
    if (c.type !== "added" && c.type !== "removed") return true;
    if (isPresence(c.key)) return true;
    const dev = deviceOf(c.key);
    if (!dev) return true;
    const pres = changes.find((x) => x.key === dev);
    return !(pres && pres.type === c.type);
  });
  return { changes: collapsed, unchanged };
}

const CAT_ORDER = ["catSystem", "catCpu", "catMemory", "catGpu", "catMotherboard", "catStorage", "catNetwork", "catDisplay", "catBattery", "catPeripherals"];
function renderDiff() {
  const area = $("diffArea");
  const cmp = state.compare;
  if (!cmp) { area.style.display = "none"; area.innerHTML = ""; return; }
  const d = diffReports(cmp.before, cmp.after);
  const counts = { changed: 0, added: 0, removed: 0 };
  d.changes.forEach((c) => { counts[c.type]++; });
  const val = (v) => (v === null ? t("na") : v);
  let h = `<h3><span>🔍 ${escapeHtml(t("compareTitle"))}</span><span class="spacer"></span><button class="btn" id="btnDiffClose">${escapeHtml(t("diffClose"))}</button></h3>`;
  h += `<div class="dmeta">${escapeHtml(t("diffBefore"))}: <b>${escapeHtml(cmp.before.collectedAt || t("na"))}</b>　→　${escapeHtml(t("diffAfter"))}: <b>${escapeHtml(cmp.after.collectedAt || t("na"))}</b></div>`;
  h += `<div class="dsummary">${escapeHtml(t("diffChanged"))}: ${counts.changed} · ${escapeHtml(t("diffAdded"))}: ${counts.added} · ${escapeHtml(t("diffRemoved"))}: ${counts.removed} · ${escapeHtml(t("diffUnchanged"))}: ${d.unchanged.length}</div>`;
  if (!d.changes.length) h += `<div>${escapeHtml(t("diffNone"))}</div>`;
  CAT_ORDER.forEach((catKey) => {
    const rows = d.changes.filter((c) => c.catKey === catKey);
    if (!rows.length) return;
    h += `<div class="dcat">${escapeHtml(t(catKey))}</div>`;
    rows.forEach((c) => {
      if (c.type === "changed") {
        h += `<div class="diffrow"><span class="chip chg">${escapeHtml(t("diffChanged"))}</span><span class="dlabel">${escapeHtml(c.label)}</span><span class="dbefore">${escapeHtml(val(c.before))}</span><span class="darrow">→</span><span class="dafter">${escapeHtml(val(c.after))}</span></div>`;
      } else if (c.type === "added") {
        h += `<div class="diffrow"><span class="chip add">${escapeHtml(t("diffAdded"))}</span><span class="dlabel">${escapeHtml(c.label)}</span><span class="dafter">${escapeHtml(val(c.after))}</span></div>`;
      } else {
        h += `<div class="diffrow"><span class="chip del">${escapeHtml(t("diffRemoved"))}</span><span class="dlabel">${escapeHtml(c.label)}</span><span class="dbefore" style="text-decoration:none">${escapeHtml(val(c.before))}</span></div>`;
      }
    });
  });
  if (d.unchanged.length) {
    h += `<details><summary>${escapeHtml(t("diffShowUnchanged"))} (${d.unchanged.length})</summary><div class="unchanged-list">` +
      d.unchanged.map((u) => escapeHtml(u.label) + ": " + escapeHtml(val(u.value))).join("<br>") + `</div></details>`;
  }
  h += `<div class="dnote">${escapeHtml(t("diffExcludedNote"))}</div>`;
  area.innerHTML = h;
  area.style.display = "block";
  $("btnDiffClose").addEventListener("click", () => { state.compare = null; renderDiff(); });
}

/* Order a pair by collection time: earlier = before, later = after.
   The main view then shows the "after" report. */
function setCompare(a, b) {
  const ta = Date.parse(a && a.collectedAt);
  const tb = Date.parse(b && b.collectedAt);
  let before = a, after = b;
  if (!isNaN(ta) && !isNaN(tb) && ta > tb) { before = b; after = a; }
  state.compare = { before, after };
  state.report = after;
  renderReport();
}

/* ---------- masked share export ----------
   Masking is by field, never by pattern matching on strings, so value
   formats (AA-BB-.. vs AA:BB:.., IPv6 notation, EUI-64 link-local
   addresses that embed the MAC) cannot slip through. Only values that
   are present are replaced; "unavailable" (null) stays null, so a
   masked copy never fabricates data. Free-text fields (drive labels,
   device names) are NOT masked — the share dialog says so. */
function maskReport(rep) {
  const copy = JSON.parse(JSON.stringify(rep));
  const M = t("maskedValue");
  if (copy.system && !isNil(copy.system.computerName)) copy.system.computerName = M;
  (copy.network || []).forEach((n) => {
    if (!isNil(n.macAddress)) n.macAddress = M;
    if (Array.isArray(n.ipv4)) n.ipv4 = n.ipv4.map(() => M);
    if (Array.isArray(n.ipv6)) n.ipv6 = n.ipv6.map(() => M);
  });
  return copy;
}

function renderReport() {
  const rep = state.report;
  if (!rep) return;
  const sections = buildSections(rep);
  $("cards").innerHTML = sections.map((s) => {
    const inner = s.groups.map((g) => {
      const rowsHtml = g.rows.map((r) => {
        let h = rowHtml(r);
        if (typeof r.bar === "number") {
          h += `<tr data-search="${escapeHtml(r.search)}"><td class="k">${escapeHtml(t("fUsed"))}</td><td class="v">${r.bar} %<div class="bar"><div style="width:${r.bar}%" class="${r.bar >= 90 ? "hot" : ""}"></div></div></td></tr>`;
        }
        return h;
      }).join("");
      return (g.subtitle ? `<div class="subttl">${escapeHtml(g.subtitle)}</div>` : "") + `<table class="kv">${rowsHtml}</table>`;
    }).join("");
    return card(s.icon, s.title, inner);
  }).join("");

  const meta = [];
  if (rep.collectedAt) meta.push(`<span>${escapeHtml(t("metaCollected"))}: <b>${escapeHtml(rep.collectedAt)}</b></span>`);
  if (rep.collector) meta.push(`<span>${escapeHtml(t("metaCollector"))}: <b>${escapeHtml(rep.collector)}</b></span>`);
  $("reportMeta").innerHTML = meta.join("　·　");
  $("sampleBanner").style.display = rep.sampleData ? "block" : "none";
  $("emptyState").style.display = "none";
  $("reportArea").style.display = "block";
  $("btnExportTxt").disabled = false;
  $("btnExportJson").disabled = false;
  $("btnShareExport").disabled = false;
  renderDiff();
  applySearch();
}

/* ---------- load paths ---------- */
function showError(msg) {
  const b = $("errBanner");
  b.textContent = msg;
  b.style.display = msg ? "block" : "none";
}
function parseAndLoad(text) {
  showError("");
  let obj;
  try {
    obj = JSON.parse(String(text).replace(/^\uFEFF/, ""));
  } catch (e) {
    showError(t("errParse"));
    return false;
  }
  if (!obj || typeof obj !== "object") { showError(t("errParse")); return false; }
  if (obj.format !== "moni-report") showError(t("errFormat"));
  state.report = obj;
  state.compare = null;
  renderReport();
  return true;
}
function loadSample() {
  showError("");
  state.report = JSON.parse(JSON.stringify(SAMPLE_REPORT));
  state.compare = null;
  renderReport();
}

/* ---------- search ---------- */
function applySearch() {
  const q = $("searchInput").value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll("#cards .card").forEach((cardEl) => {
    let cardVisible = false;
    cardEl.querySelectorAll("tr[data-search]").forEach((tr) => {
      const hit = !q || tr.getAttribute("data-search").includes(q);
      tr.style.display = hit ? "" : "none";
      if (hit) cardVisible = true;
    });
    cardEl.querySelectorAll(".subttl").forEach((st) => {
      let tbl = st.nextElementSibling, subVisible = false;
      if (tbl) tbl.querySelectorAll("tr[data-search]").forEach((tr) => { if (tr.style.display !== "none") subVisible = true; });
      st.style.display = subVisible ? "" : "none";
      if (tbl) tbl.style.display = subVisible ? "" : "none";
    });
    cardEl.style.display = cardVisible ? "" : "none";
    if (cardVisible) anyVisible = true;
  });
  $("noMatch").style.display = (q && !anyVisible) ? "block" : "none";
}

/* ---------- export ---------- */
function buildTextExport(repOverride, opts) {
  const rep = repOverride || state.report;
  if (!rep) return "";
  const lines = ["Moni Device Report", "=================="];
  if (opts && opts.masked) lines.push(t("shareMaskedHeader"));
  if (rep.collectedAt) lines.push(t("metaCollected") + ": " + rep.collectedAt);
  if (rep.collector) lines.push(t("metaCollector") + ": " + rep.collector);
  if (rep.sampleData) lines.push(t("sampleBanner"));
  buildSections(rep).forEach((s) => {
    lines.push("", "[" + s.title + "]");
    s.groups.forEach((g) => {
      if (g.subtitle) lines.push("  -- " + g.subtitle);
      g.rows.forEach((r) => {
        lines.push("  " + (r.label ? r.label + ": " : "") + r.display);
        if (typeof r.bar === "number") lines.push("  " + t("fUsed") + ": " + r.bar + " %");
      });
    });
  });
  return lines.join("\n");
}
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* ---------- language ---------- */
function applyLang() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.getAttribute("data-i18n")); });
  $("searchInput").placeholder = t("searchPlaceholder");
  $("langSel").value = state.lang;
  if (state.report) renderReport();
}
function setLang(lang) {
  state.lang = I18N[lang] ? lang : "en";
  try { localStorage.setItem("moni-lang", state.lang); } catch (e) {}
  applyLang();
}

/* ---------- wiring ---------- */
$("btnOpen").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => parseAndLoad(String(reader.result || ""));
  reader.readAsText(f);
  e.target.value = "";
});
$("btnSample").addEventListener("click", loadSample);
$("btnPaste").addEventListener("click", () => { $("pasteModal").style.display = "flex"; $("pasteText").focus(); });
$("btnPasteCancel").addEventListener("click", () => { $("pasteModal").style.display = "none"; });
$("btnPasteLoad").addEventListener("click", () => {
  if (parseAndLoad($("pasteText").value)) $("pasteModal").style.display = "none";
});
$("pasteModal").addEventListener("click", (e) => { if (e.target === $("pasteModal")) $("pasteModal").style.display = "none"; });
$("btnExportTxt").addEventListener("click", () => download("moni-report.txt", buildTextExport()));
$("btnExportJson").addEventListener("click", () => download("moni-report.json", JSON.stringify(state.report, null, 2), "application/json;charset=utf-8"));

/* ---------- compare wiring ---------- */
$("btnCompare").addEventListener("click", () => $("compareFileInput").click());
$("compareFileInput").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    let obj = null;
    try { obj = JSON.parse(String(reader.result || "").replace(/^\uFEFF/, "")); } catch (err) { obj = null; }
    if (!obj || typeof obj !== "object" || obj.format !== "moni-report" || !state.report) {
      showError(t("errCompare"));
      return;
    }
    showError("");
    setCompare(state.report, obj);
  };
  reader.readAsText(f);
  e.target.value = "";
});

/* ---------- share export wiring ---------- */
function shareMaskMode() {
  const el = document.querySelector('input[name="shareMask"]:checked');
  return el ? el.value : "masked";
}
function updateShareInfo() {
  const masked = shareMaskMode() === "masked";
  $("shareMaskedInfo").style.display = masked ? "block" : "none";
  $("shareFullInfo").style.display = masked ? "none" : "block";
}
document.querySelectorAll('input[name="shareMask"]').forEach((r) => r.addEventListener("change", updateShareInfo));
$("btnShareExport").addEventListener("click", () => { updateShareInfo(); $("shareModal").style.display = "flex"; });
$("btnShareCancel").addEventListener("click", () => { $("shareModal").style.display = "none"; });
$("shareModal").addEventListener("click", (e) => { if (e.target === $("shareModal")) $("shareModal").style.display = "none"; });
$("btnShareJson").addEventListener("click", () => {
  const masked = shareMaskMode() === "masked";
  const rep = masked ? maskReport(state.report) : state.report;
  download(masked ? "moni-report-shared.json" : "moni-report.json", JSON.stringify(rep, null, 2), "application/json;charset=utf-8");
  $("shareModal").style.display = "none";
});
$("btnShareTxt").addEventListener("click", () => {
  const masked = shareMaskMode() === "masked";
  const rep = masked ? maskReport(state.report) : state.report;
  download(masked ? "moni-report-shared.txt" : "moni-report.txt", buildTextExport(rep, { masked }));
  $("shareModal").style.display = "none";
});
$("searchInput").addEventListener("input", applySearch);
$("langSel").addEventListener("change", (e) => setLang(e.target.value));

let dragDepth = 0;
window.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; $("dropOverlay").style.display = "flex"; });
window.addEventListener("dragleave", (e) => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; $("dropOverlay").style.display = "none"; } });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0;
  $("dropOverlay").style.display = "none";
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) {
    const reader = new FileReader();
    reader.onload = () => parseAndLoad(String(reader.result || ""));
    reader.readAsText(f);
  }
});

/* ---------- init ---------- */
(function init() {
  let saved = null;
  try { saved = localStorage.getItem("moni-lang"); } catch (e) {}
  state.lang = saved && I18N[saved] ? saved : ((navigator.language || "en").startsWith("ja") ? "ja" : "en");
  applyLang();
})();

/* Test hooks (used by tests/ui-test; harmless in normal use). */
window.Moni = {
  loadReport: (obj) => { state.report = obj; state.compare = null; renderReport(); },
  parseAndLoad,
  loadSample,
  setLang,
  buildTextExport,
  getReport: () => state.report,
  diffReports,
  maskReport,
  setCompare,
  getCompare: () => state.compare
};
</script>
</body>
</html>
