# Docker Compose configuration for Moni System Monitor
# Production-ready setup with monitoring and security

version: '3.8'

services:
  moni:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: moni-monitor
    restart: unless-stopped

    # Security configuration
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE  # Required for process monitoring
      - NET_RAW     # Required for network monitoring

    # Environment variables
    environment:
      - MONI_CONFIG_DIR=/home/moni/.config/moni
      - MONI_LOG_LEVEL=INFO
      - MONI_ENABLE_SECURITY_LOGGING=true
      - MONI_RATE_LIMIT_ENABLED=true
      - MONI_MAX_MEMORY_MB=500
      - DISPLAY=${DISPLAY:-:0}

    # Volume mounts
    volumes:
      - moni_config:/home/moni/.config/moni
      - moni_logs:/home/moni/.config/moni/logs
      - moni_exports:/home/moni/.config/moni/exports
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Optional: for container monitoring

    # Network configuration
    network_mode: host  # Required for accurate system monitoring

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import src.moni.main; print('Health OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=moni,environment=production"

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: moni-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"  # nobody user
    read_only: true
    tmpfs:
      - /tmp

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: moni-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    security_opt:
      - no-new-privileges:true
    user: "472:472"  # grafana user
    depends_on:
      - prometheus

  # Optional: Log aggregation with Loki
  loki:
    image: grafana/loki:latest
    container_name: moni-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"  # loki user

# Named volumes for data persistence
volumes:
  moni_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/config
  moni_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/logs
  moni_exports:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/exports
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

# Network configuration
networks:
  default:
    name: moni-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16