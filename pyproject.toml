[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "moni"
description = "Government-grade system monitoring solution with enterprise security and real-time analytics"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Moni Development Team"}
]
keywords = [
    "system-monitor", "performance", "security", "government", "enterprise",
    "monitoring", "analytics", "fips-140-2", "zero-trust", "compliance"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Environment :: Desktop Environment",
    "Environment :: Console"
]
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.8",
    "PySide6>=6.7.0",
    "pydantic>=2.6.0",
    "GPUtil>=1.4.0",
    "pynvml>=11.5.0",
    "matplotlib>=3.8.0",
    "keyboard>=0.13.5",
    "Pillow>=10.0.0",
    "cryptography>=41.0.0",
    "fastapi>=0.111.0",
    "stripe>=10.0.0",
    "uvicorn[standard]>=0.30.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "redis>=5.0.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0",
    "watchdog>=3.0.0",
    "pyyaml>=6.0.1"
]
dynamic = ["version"]

[project.scripts]
moni = "moni.main:main"
moni-cli = "moni.cli:main"
moni-config = "moni.config_cli:main"
moni-billing-api = "moni.billing_api:main"

[project.gui-scripts]
moni-gui = "moni.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.1",
    "pytest-qt>=4.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.5",
    "safety>=3.0.0",
    "pre-commit>=3.5.0"
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-mermaid2-plugin>=1.0.0"
]
enterprise = [
    "redis>=5.0.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0"
]

[tool.setuptools]
packages = ["moni"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
moni = [
    "assets/*",
    "templates/*",
    "configs/*.yaml",
    "configs/*.json"
]

[tool.setuptools_scm]
write_to = "src/moni/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR2004", # magic value comparison
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]
"__init__.py" = ["F401"]

[tool.ruff.mccabe]
max-complexity = 10

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "psutil.*",
    "GPUtil.*",
    "pynvml.*",
    "keyboard.*",
    "pyotp.*",
    "qrcode.*",
    "watchdog.*"
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src/moni",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gui: marks tests that require GUI",
    "security: marks security-related tests",
    "performance: marks performance tests"
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

# Coverage configuration
[tool.coverage.run]
source = ["src/moni"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/main.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
tests = ["B201", "B301", "B302", "B303", "B304", "B305", "B306", "B307", "B313", "B314", "B315", "B316", "B317", "B318", "B319", "B320", "B325", "B601", "B602", "B603", "B604", "B605", "B606", "B607", "B608", "B609", "B610", "B611"]
