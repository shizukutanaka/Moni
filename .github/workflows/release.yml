name: Release

# Tag a release (v*) to publish the portable ZIP and the desktop app on a
# GitHub Release. Pull requests and manual runs only build and upload
# Actions artifacts — they never create a Release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/**"
      - "package*.json"
      - "index.html"
      - "collect*"
      - "sample-report.json"
      - "tests/macos-package-test.js"
      - "tests/windows-package-test.ps1"
      - "tests/validate.js"
      - "tests/sample-report-mac.json"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate schema, embedded sample and collector scripts
        run: node tests/validate.js
      - name: Build portable ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/Moni
          # Portable ZIP contents: the viewer, one collector per OS, the
          # fictional sample report, README and LICENSE. Nothing else —
          # in particular no collected report (moni-report.json) is included.
          cp -p index.html collect.ps1 collect.bat collect.sh collect-mac.sh \
            sample-report.json README.md LICENSE dist/Moni/
          chmod +x dist/Moni/collect.sh dist/Moni/collect-mac.sh
          (cd dist && zip -r Moni.zip Moni)
          (cd dist && sha256sum Moni.zip > Moni.zip.sha256)
          unzip -l dist/Moni.zip
          cat dist/Moni.zip.sha256
      - name: Upload ZIP as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moni
          path: |
            dist/Moni.zip
            dist/Moni.zip.sha256
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: "dist/*.exe"
          - os: macos-latest
            asset: "dist/*.zip"
          - os: ubuntu-latest
            asset: "dist/*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build desktop app (never publishes by itself)
        run: npx electron-builder --publish never
      - name: Launch the macOS release ZIP with sample reports
        if: runner.os == 'macOS'
        run: node tests/macos-package-test.js dist/*-mac.zip
      - name: Launch the Windows portable EXE
        if: runner.os == 'Windows'
        run: ./tests/windows-package-test.ps1
      - name: Upload desktop app as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moni-desktop-${{ matrix.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Moni*
          path: release-assets
      - name: Publish GitHub Release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release-assets/Moni && sha256sum --check Moni.zip.sha256)
          shopt -s nullglob
          windows=(release-assets/Moni-desktop-windows-latest/*.exe)
          macos=(release-assets/Moni-desktop-macos-latest/*.zip)
          linux=(release-assets/Moni-desktop-ubuntu-latest/*.AppImage)
          if ((${#windows[@]} == 0 || ${#macos[@]} == 0 || ${#linux[@]} == 0)); then
            echo "Missing desktop release assets" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/Moni/Moni.zip release-assets/Moni/Moni.zip.sha256 \
            "${windows[@]}" "${macos[@]}" "${linux[@]}" \
            --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "Moni ${GITHUB_REF_NAME}" --generate-notes
