name: Moni CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Run linting
      run: |
        ruff check src/ tests/
        ruff format --check src/ tests/

    - name: Run type checking
      run: |
        mypy src/moni/

    - name: Run security checks
      run: |
        bandit -r src/moni/ -f json -o bandit-report.json
        safety check --json --output safety-report.json
      continue-on-error: true

    - name: Run unit tests
      run: |
        pytest tests/ --cov=src/moni --cov-report=xml --cov-report=html --junit-xml=junit.xml
      env:
        DISPLAY: ':99.0'

    - name: Run integration tests
      if: matrix.os == 'ubuntu-latest'
      run: |
        pytest tests/integration/ --junit-xml=integration-junit.xml

    - name: Run performance tests
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      run: |
        python tests/performance/benchmark.py

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          junit.xml
          integration-junit.xml
          coverage.xml
          htmlcov/
          bandit-report.json
          safety-report.json

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        languages: python

  build:
    name: Build Application
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        pyinstaller --onefile --windowed \
          --name moni-${{ matrix.os }} \
          --add-data "src/moni:moni" \
          --hidden-import=PySide6.QtCore \
          --hidden-import=PySide6.QtWidgets \
          --hidden-import=PySide6.QtGui \
          src/moni/main.py

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: moni-${{ matrix.os }}
        path: dist/

  docker-build:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      if: github.event_name == 'release'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: moni/system-monitor
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name == 'release' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, build, docker-build]
    if: github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create release archive
      run: |
        cd artifacts/
        for dir in */; do
          tar -czf "${dir%/}.tar.gz" "$dir"
        done

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/*.tar.gz
          CHANGELOG.md
          README.md
        body: |
          ## What's Changed

          This release includes the latest features, improvements, and bug fixes for Moni System Monitor.

          ### Installation

          **Docker:**
          ```bash
          docker pull moni/system-monitor:${{ github.event.release.tag_name }}
          ```

          **Binary Downloads:**
          - Linux: [moni-ubuntu-latest.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/moni-ubuntu-latest.tar.gz)
          - Windows: [moni-windows-latest.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/moni-windows-latest.tar.gz)
          - macOS: [moni-macos-latest.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/moni-macos-latest.tar.gz)

          ### Government & Enterprise Features

          This release includes government-grade security features:
          - ✅ FIPS 140-2 Level 2 encryption
          - ✅ Zero Trust Architecture
          - ✅ Multi-factor authentication
          - ✅ Compliance frameworks (NIST, ISO 27001, SOC 2, FedRAMP)
          - ✅ Advanced threat intelligence
          - ✅ Comprehensive audit logging

          ### Security & Performance

          - ✅ Production-grade error recovery
          - ✅ Advanced performance profiling
          - ✅ Comprehensive accessibility (WCAG 2.1 AA/AAA)
          - ✅ Enterprise configuration management
          - ✅ Real-time monitoring and alerting
        draft: false
        prerelease: false

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install documentation dependencies
      run: |
        pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin
        pip install -r requirements.txt

    - name: Generate API documentation
      run: |
        python scripts/generate_api_docs.py

    - name: Build documentation
      run: |
        mkdocs build --clean

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [test, build, docker-build, security-scan]
    if: always()

    steps:
    - name: Notify Slack on Success
      if: ${{ needs.test.result == 'success' && needs.build.result == 'success' }}
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#ci-cd'
        text: '✅ Moni CI/CD pipeline completed successfully'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: ${{ needs.test.result == 'failure' || needs.build.result == 'failure' }}
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#ci-cd'
        text: '❌ Moni CI/CD pipeline failed'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}